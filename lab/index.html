<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenleaf Creature Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1c1e; overflow: hidden; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #e8e4d8; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; padding: 2px 6px; background: rgba(0,0,0,.55); border-radius: 3px; white-space: nowrap; }
      #panel { position: fixed; top: 8px; right: 8px; background: rgba(10,12,14,.82); padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
      #panel.hidden { display: none; }
      #panel label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
      #panel select, #panel input { background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; font: inherit; }
      #info { white-space: pre; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="labels"></div>
    <div id="panel" class="hidden">
      <label>subject <select id="subject"></select></label>
      <label>animation <select id="anim"></select></label>
      <label>view <select id="mode"><option>orbit</option><option>quad</option><option>sheet</option></select></label>
      <label>wireframe <input id="wire" type="checkbox" /></label>
      <label>paused <input id="paused" type="checkbox" /></label>
      <div id="info"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
