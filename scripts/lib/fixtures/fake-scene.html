<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
    // Deliberately NOT real three.js — a fake object graph implementing
    // only .traverse()/.getObjectByName() and the fields getSceneSummary()
    // reads (.name, .type, .position, .visible, .material.type). Enough to
    // test live-scene.ts's page.evaluate() logic without needing a real
    // three.js scene or real WebGL rendering — this fixture is testing the
    // integration glue, not rendering fidelity.
    function makeObj(name, type, x, y, z, extra) {
      return Object.assign(
        { name, type, position: { x, y, z }, visible: true },
        extra || {},
      );
    }
    const light = makeObj("TestLight", "PointLight", 1, 2, 3, { intensity: 0.5 });
    const mesh = makeObj("TestMesh", "Mesh", 0, 0, 0, {
      material: { type: "MeshStandardMaterial" },
    });
    const children = [light, mesh];

    window.scene = {
      name: "Scene",
      traverse(fn) {
        fn(this);
        children.forEach(fn);
      },
      getObjectByName(name) {
        return children.find((o) => o.name === name) || null;
      },
    };
    </script>
  </body>
</html>
